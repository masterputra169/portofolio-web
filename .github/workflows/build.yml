name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # weekly rebuild so new GitHub repos show up on the site (Monday 01:17 UTC)
    - cron: '17 1 * * 1'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          retention-days: 7
